<style>
:root{--bg:#f6f4ef;--fg:#1c1c1a;--sub:#8a877f;--acc:#b4532f;--line:#e2ded4;--card:#fbfaf7;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#141413;--fg:#ecebe6;--sub:#8c8a84;--acc:#e08a63;--line:#2b2a28;--card:#1b1b1a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"SF Pro Text","Hiragino Sans",sans-serif;display:grid;place-items:center;padding:16px}
form{width:min(360px,100%);display:grid;gap:16px;padding:8px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:600}
h1{font-family:"Iowan Old Style","Hiragino Mincho ProN",Georgia,serif;font-size:26px;line-height:1.3;font-weight:600;margin:6px 0 0}
label{font-size:12px;color:var(--sub)}
input[type=password]{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;margin-top:6px}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--sub)}
button{font:inherit;font-weight:600;border:0;background:var(--fg);color:var(--bg);padding:13px 16px;border-radius:12px;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
.err{color:var(--acc);font-size:13px;min-height:1.4em;margin:0}
</style>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function unlock(pw){
  const key=await derive(pw);
  const buf=b64(P.data);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},key,buf.slice(12));
  const html=new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
return unlock;
})();

<body>
<form id="f" autocomplete="off">
  <div><div class="eyebrow">Read aloud · Shadowing</div><h1>音読・シャドーイング</h1></div>
  <div><label for="pw">パスワード</label>
  <input id="pw" type="password" autocomplete="current-password" required></div>
  <label class="row"><input id="rem" type="checkbox"> このブラウザで、パスワードを覚えておく</label>
  <p class="err" id="err" role="alert"></p>
  <button id="go" type="submit">開く</button>
</form>
<script>(()=>{
const $=id=>document.getElementById(id);
const KEY='ondoku.pw';
async function tryOpen(pw,remember,silent){
  $('go').disabled=true; $('err').textContent='';
  try{
    if(!window.crypto||!crypto.subtle) throw new Error('nocrypto');
    if(remember){try{localStorage.setItem(KEY,pw)}catch(e){}}
    await window.__unlock(pw);
  }catch(e){
    $('go').disabled=false;
    if(e&&e.message==='nocrypto'){$('err').textContent='このブラウザでは開けません。https のアドレスで開いてください。';return}
    try{localStorage.removeItem(KEY)}catch(_){}
    if(!silent) $('err').textContent='パスワードが違います。';
  }
}
$('f').addEventListener('submit',ev=>{ev.preventDefault();tryOpen($('pw').value,$('rem').checked,false)});
try{const saved=localStorage.getItem(KEY); if(saved) tryOpen(saved,false,true)}catch(e){}
})();
</script>
</body>
